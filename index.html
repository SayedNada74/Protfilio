<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sayed Nada - Frontend Developer & UI/UX Designer. Interactive portfolio showcasing engineering, design, and shipped products." />
    
    <!-- Instant Theme Initializer (Eliminates Flash of Dark Theme) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    
    <!-- OpenGraph / Social Meta Tags -->
    <meta property="og:title" content="Sayed Nada | Portfolio" />
    <meta property="og:description" content="Frontend Developer & UI/UX Designer. Interactive portfolio showcasing engineering, design, and shipped products." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />

    <!-- Fonts & Performance Preconnects -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Sayed Nada | Portfolio</title>
    
    <!-- Structured Data (JSON-LD) -->

    {
      "@context": "https://schema.org",

      "name": "Sayed Nada",

      "sameAs": [
        "https://github.com/SayedNada74",

      ],
      "knowsAbout": ["React", "TypeScript", "Next.js", "UI/UX Design", "Three.js"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
